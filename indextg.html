<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語煉金術 V2.62</title>
    <style>
        :root {
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.8); --accent: #6366f1;
            --gold: #f59e0b; --text: #f8fafc; --success: #22c55e; --error: #ef4444;
            --pink: #ec4899; --green: #10b981; 
            --btn-wea: #431407; --btn-wea-active: #f59e0b;
            --btn-pet: #064e3b; --btn-pet-active: #10b981;
        }
        
        body { 
            margin: 0; font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg) url('images/main_bg.png') no-repeat center center fixed; 
            background-size: cover; color: var(--text); overflow-x: hidden;
        }

        .ui-max-width { width: 100%; max-width: 400px; margin: 0 auto; }

        @keyframes slash-anim {
            0% { transform: translate(-100%, -50%) rotate(-20deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(100%, -50%) rotate(-20deg); opacity: 0; }
        }
        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .slash-effect {
            position: fixed; top: 50%; left: 0; width: 200%; height: 3px; 
            background: white; box-shadow: 0 0 15px #fff, 0 0 5px var(--accent);
            z-index: 10002; pointer-events: none; opacity: 0;
        }
        .slash-active { animation: slash-anim 0.3s ease-out forwards; }
        .shake-active { animation: shake-anim 0.15s ease-in-out 2; }

        .overlay-base { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #result-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); display: none; }
        #result-img { max-width: 50%; max-height: 50%; object-fit: contain; animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        #start-overlay { background: var(--bg); z-index: 10001; flex-direction: column; }
        .start-logo { width: 80%; max-width: 400px; margin-bottom: 30px; filter: drop-shadow(0 0 20px var(--accent)); }
        
        .login-box { background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); display: flex; flex-direction: column; gap: 15px; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .login-input { padding: 12px; border-radius: 10px; border: 1px solid #475569; background: var(--bg); color: white; text-align: center; font-size: 1rem; outline: none; width: 100%; box-sizing: border-box; }
        .eye-btn { position: absolute; right: 12px; cursor: pointer; font-size: 1.2rem; user-select: none; opacity: 0.8; }
        
        .btn-base { border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-init { padding: 20px 50px; font-size: 1.5rem; color: white; background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); animation: pulse 2s infinite; }

        #video-opening { position: fixed; inset: 0; background: black; z-index: 10000; display: none; }
        .skip-btn { position: absolute; bottom: 30px; right: 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid white; padding: 10px 20px; border-radius: 20px; cursor: pointer; }

        .page { display: none; padding: 20px; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .page.active { display: flex; }

        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; width: 100%; }
        .coin-bar { background: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 30px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
        
        .admin-table-container { width: 100%; max-width: 600px; overflow-x: auto; border-radius: 10px; margin: 0 auto; border: 1px solid rgba(255,255,255,0.1); }
        .admin-table { width: 100%; border-collapse: collapse; background: var(--card); font-size: 1rem; white-space: nowrap; }
        .admin-table th, .admin-table td { padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .admin-table th { background: rgba(99, 102, 241, 0.4); color: var(--gold); font-weight: normal; }
        .admin-section { width: 100%; max-width: 450px; background: var(--card); border: 1px solid var(--accent); border-radius: 15px; padding: 15px; margin-top: 20px; }

        .staff-only-zone { margin-top: 30px; width: 100%; max-width: 450px; border-top: 1px dashed #475569; padding-top: 15px; text-align: center; }
        .staff-rule { font-size: 0.75rem; color: #fb7185; margin-bottom: 10px; font-weight: bold; }
        .staff-content { display: none; padding: 10px; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }

        .hero-btn { width: 100%; height: 72px; font-size: 1.25rem; font-weight: 800; color: white; cursor: pointer; background: transparent no-repeat center / contain; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); margin-bottom: 12px; border: none; }
        .btn-1 { background-image: url('images/btn_icon_1.png'); }
        .btn-2 { background-image: url('images/btn_icon_2.png'); }
        .btn-3 { background-image: url('images/btn_icon_3.png'); }
        .btn-4 { background-image: url('images/btn_icon_4.png'); }
        .btn-5 { background-image: url('images/btn_icon_5.png'); }

        .category-nav { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; }
        .cat-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; font-weight: bold; cursor: pointer; font-size: 1rem;}
        .cat-btn-wea { background: var(--btn-wea); }
        .cat-btn-pet { background: var(--btn-pet); }
        .cat-btn.active { border-color: white; color: white; }
        .cat-btn-wea.active { background: var(--btn-wea-active); }
        .cat-btn-pet.active { background: var(--btn-pet-active); }

        .inventory, .shop-grid { display: grid; gap: 15px; width: 100%; max-width: 400px; }
        .inventory { grid-template-columns: repeat(3, 1fr); }
        .shop-grid { grid-template-columns: repeat(4, 1fr); }

        .inv-slot, .shop-item { background: var(--card); aspect-ratio: 1; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        .inv-slot img, .shop-item img { width: 90%; height: 90%; object-fit: contain; }
        
        .shop-item.locked img { filter: brightness(0); opacity: 0.7; }
        .shop-item.owned img { filter: none; opacity: 0.4; }
        .shop-price-tag { position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.7); font-size: 0.7rem; color: var(--gold); text-align: center; padding: 2px 0; z-index: 2; }

        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; width: 100%; }
        .level-card { background: var(--card); aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: 3px solid; cursor: pointer; position: relative; color: white !important; font-weight: bold; }
        .level-card.choice { border-color: var(--accent); } 
        .level-card.spell { border-color: var(--green); }     
        .level-card.cloze { border-color: var(--pink); }     
        .level-card.all-correct::after { content: '✔️'; position: absolute; top: -5px; right: -5px; background: var(--success); border-radius: 50%; font-size: 0.8rem; padding: 2px; color: white; border: 1px solid white; }

        .q-card { background: var(--card); padding: 30px; border-radius: 24px; text-align: center; margin: 20px 0; border: 2px solid transparent; backdrop-filter: blur(10px); }
        .btn-solid { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); border-radius: 15px; padding: 12px 20px; color: white; border: none; font-weight: bold; cursor: pointer; }
        .opt-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 18px; border-radius: 15px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 1.1rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div id="slash-layer" class="slash-effect"></div>
    <div id="result-overlay" class="overlay-base"><img id="result-img" src=""></div>

    <div id="start-overlay" class="overlay-base">
        <img src="images/title_logo.png" class="start-logo">
        <div class="login-box">
            <h3 style="text-align:center; margin:0; color:var(--gold);">修行者報到</h3>
            <input type="text" id="stu-id" class="login-input" placeholder="帳號ID">
            <div class="input-wrapper">
                <input type="password" id="stu-pwd" class="login-input" placeholder="密碼">
                <span class="eye-btn" onclick="togglePassword('stu-pwd', this)">👁️</span>
            </div>
            <button class="btn-base btn-init" style="font-size: 1.2rem; padding: 15px;" id="login-trigger">開始修行</button>
            <button class="btn-solid" style="background: #475569;" id="guest-trigger">以訪客身份體驗</button>
        </div>
    </div>

    <div id="video-opening" class="overlay-base">
        <video id="opening-vid" style="width:100%; height:100%; object-fit:contain;" playsinline><source src="video/opening.mp4" type="video/mp4"></video>
        <button class="skip-btn" id="skip-vid">跳過 Skip</button>
    </div>

    <div id="admin-page" class="page">
        <h2 style="color:var(--gold); margin-bottom: 15px; font-size: 1.5rem;">管理系統</h2>
        
        <div class="admin-table-container">
            <table class="admin-table">
                <thead>
                    <tr><th>學號 ID</th><th>真意</th><th>迴音</th><th>萬辭</th><th>每日</th><th>最後上線</th><th>金幣</th></tr>
                </thead>
                <tbody id="student-stats-body"></tbody>
            </table>
        </div>

        <div class="admin-section">
            <h4 style="margin: 0 0 10px 0; color: var(--gold); text-align: center; font-size: 1rem;">📜 登錄新學生</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <input type="text" id="reg-id" class="login-input" style="padding: 10px; font-size: 0.9rem;" placeholder="學號ID">
                <input type="text" id="reg-pwd" class="login-input" style="padding: 10px; font-size: 0.9rem;" placeholder="密碼">
                <input type="text" id="reg-pwd-confirm" class="login-input" style="grid-column: span 2; padding: 10px; font-size: 0.9rem;" placeholder="確認密碼">
                <button class="btn-solid" style="grid-column: span 2; background: var(--success); padding: 10px;" id="register-student-btn">確認新增學生</button>
            </div>
        </div>

        <div class="staff-only-zone">
            <div class="staff-rule">守則：此區域僅供系統工作人員使用。</div>
            <div class="staff-tool-container">
                <button class="btn-solid" style="background:none; border:1px solid #a093ad; width:40%; color:#a093ad; font-size: 0.7rem;" id="toggle-staff-btn">展開系統數據工具</button>
                <div id="staff-content" class="staff-content">
                    <button class="btn-solid" style="background: #32a4d1; font-size: 0.75rem;" id="sync-data-btn">將本地題目同步至雲端 (批量)</button>
                    <button class="btn-solid" style="background: #450a0a; border: 1px solid #ef4444; font-size: 0.75rem; margin-top: 5px;" id="clear-questions-btn">🔥 清空雲端所有題目</button>
                    <div id="sync-status" style="font-size: 0.7rem; color: #22c55e; margin-top:5px;"></div>
                </div>
            </div>
        </div>

        <button class="btn-solid" style="background:#475569; margin-top:20px; width:200px; padding: 10px;" onclick="location.reload()">退出管理</button>
    </div>

    <div id="home-page" class="page">
        <img src="images/title_logo2.png" style="width:100%; max-width:224px; margin:10px 0;">
        <div class="header-ui ui-max-width">
            <div id="settings-trigger" style="cursor:pointer; font-size:1.5rem;">⚙️</div>
            <div class="coin-bar">💰 <span id="home-coin">0</span></div>
        </div>
        <div class="ui-max-width">
            <button class="hero-btn btn-1" id="open-choice">真意之殿</button>
            <button class="hero-btn btn-2" id="open-spell">迴音之谷</button>
            <button class="hero-btn btn-3" id="open-cloze">萬辭之塔</button>
            <div style="text-align: center;">
                <button id="daily-btn" class="hero-btn btn-4" style="margin-bottom: 5px;">每日挑戰</button>
                <div style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px;">週一至週五開放</div>
            </div>
            <button class="hero-btn btn-5" id="open-inv">藏寶閣</button>
        </div>
    </div>

    <div id="game-page" class="page">
        <div id="game-progress-tag" class="coin-bar" style="margin-top:10px;">0 / 0</div>
        <div class="ui-max-width">
            <div class="q-card" id="q-card-box">
                <div id="q-main" style="font-weight: bold; font-size: 1.5rem; margin-bottom: 10px;"></div>
                <div id="q-hint" style="color: var(--gold); font-weight: bold;"></div>
                <div id="correct-answer-display" style="color: #fb7185; margin-top: 15px; display: none; font-size: 1.4rem; font-weight: bold;"></div>
            </div>
            <div id="action-area"></div>
            <button id="next-btn" class="btn-solid" style="display: none; width:100%; margin-top:10px; background: var(--pink);">下一題</button>
            <button id="exit-game-btn" style="background:none; border:none; color:#cbd5e1; width:100%; margin-top:20px; cursor:pointer;">結束修行</button>
        </div>
    </div>

    <div id="inv-page" class="page">
        <div class="header-ui ui-max-width"><button class="btn-solid" onclick="window.goHome()">返回</button><button class="btn-solid" style="background: var(--pink); border: 1px solid white;" onclick="window.showShop()">商店 🛒</button></div>
        <div class="category-nav ui-max-width">
            <button id="inv-wea-btn" class="cat-btn cat-btn-wea">⚔️ 神兵</button>
            <button id="inv-pet-btn" class="cat-btn cat-btn-pet">🐾 靈寵</button>
        </div>
        <div class="inventory ui-max-width" id="inv-grid"></div>
    </div>

    <div id="shop-page" class="page">
        <div class="header-ui ui-max-width"><div class="coin-bar">💰 <span id="shop-coin">0</span></div><button class="btn-solid" onclick="window.showInv()">返回</button></div>
        <div class="category-nav ui-max-width">
            <button id="shop-wea-btn" class="cat-btn cat-btn-wea">⚔️ 神兵</button>
            <button id="shop-pet-btn" class="cat-btn cat-btn-pet">🐾 靈寵</button>
        </div>
        <div class="shop-grid ui-max-width" id="shop-grid"></div>
    </div>

    <div id="level-page" class="page">
        <h2 id="level-title" style="color:var(--gold);">修行關卡</h2>
        <div class="level-grid ui-max-width" id="level-container"></div>
        <button class="btn-solid" onclick="window.goHome()" style="margin-top:40px;">返回主頁</button>
    </div>

    <div id="settings-modal" class="modal">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:80%; max-width:300px;">
            <h3 style="text-align:center; color:var(--gold);">系統設定</h3>
            <button id="master-mute-btn" class="btn-solid" style="width:100%;">🔊 聲音：開啟中</button>
            <p>音樂：<input type="range" id="bgm-vol" min="0" max="1" step="0.1" value="0.5"></p>
            <p>音效：<input type="range" id="sfx-vol" min="0" max="1" step="0.1" value="0.8"></p>
            <button class="btn-solid" id="settings-close" style="width:100%; margin-top:10px;">確定</button>
        </div>
    </div>

    <div id="custom-confirm-modal" class="modal">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:80%; max-width:300px; text-align:center;">
            <h3 id="confirm-msg" style="color:var(--gold); margin-bottom:20px;">是否購買？</h3>
            <div style="display:flex; gap:10px;"><button id="confirm-yes-btn" class="btn-solid" style="flex:1; background:var(--success);">確認</button><button class="btn-solid" style="flex:1; background:var(--error);" onclick="document.getElementById('custom-confirm-modal').style.display='none'">取消</button></div>
        </div>
    </div>

    <audio id="lose-sfx" src="audio/lose.mp3"></audio>
    <audio id="success-sfx" src="audio/success.mp3"></audio>

            { en: "element", cn: "元素", s: "Water is a vital ______ of life.", p: "[n]", level: 10 },
            { en: "earthquake", cn: "地震", s: "The ______ shook the entire city.", p: "[n]", level: 10 },
            { en: "economy", cn: "經濟", s: "The country's ______ is growing steadily.", p: "[n]", level: 10 },

            { en: "humble", cn: "謙虛的", s: "He remains ______ despite his fame.", p: "[a/v]", level: 12 },
            { en: "idealistic", cn: "理想主義的", s: "She has an ______ view of the world.", p: "[a]", level: 12 },
            { en: "ignite", cn: "點燃", s: "A spark could ______ the fuel.", p: "[v]", level: 12 },
            { en: "justify", cn: "證明合理", s: "You must ______ your decision to the board.", p: "[v]", level: 12 }
        ];

        async function handleLogin() {
            const id = $('stu-id').value.trim();
            const pwd = $('stu-pwd').value.trim();
            if(!id || !pwd) return alert("請輸入 ID 及密碼");
            try {
                const docSnap = await fb.getDoc(fb.doc(fb.db, "students", id));
                if(docSnap.exists() && docSnap.data().password === pwd) {
                    if(id === "admin") {
                        $('start-overlay').style.display = 'none';
                        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                        $('admin-page').classList.add('active');
                        loadStudentData();
                    } else {
                        const data = docSnap.data();
                        const today = new Date().toLocaleDateString('zh-HK');
                        await fb.updateDoc(fb.doc(fb.db, "students", id), { lastOnline: today });
                        state.user = { id, coins: data.coins||0, collection: data.collection||[], progress: data.progress||{}, lastDaily: data.lastDailyDate||"", isGuest: false };
                        startCultivation();
                    }
                } else { alert("帳號或密碼錯誤"); }
            } catch(e) { alert("連線失敗"); }
        }

        async function loadStudentData() {
            const tbody = $('student-stats-body');
            tbody.innerHTML = '<tr><td colspan="7">載入中...</td></tr>';
            try {
                const snap = await fb.getDocs(fb.collection(fb.db, "students"));
                tbody.innerHTML = '';
                snap.forEach(d => {
                    if(d.id === 'admin') return;
                    const data = d.data();
                    const prog = data.progress || {};
                    let stats = { choice: { correct: 0, total: 0 }, spell: { correct: 0, total: 0 }, cloze: { correct: 0, total: 0 } };
                    Object.keys(prog).forEach(key => {
                        const mode = key.split('_')[0];
                        if (stats[mode] && typeof prog[key] === 'string' && prog[key].includes('/')) {
                            const [c, t] = prog[key].split('/').map(Number);
                            stats[mode].correct += (c || 0); stats[mode].total += (t || 0);
                        }
                    });
                    const fmt = (s) => `${s.correct}/${s.total}`;
                    tbody.innerHTML += `<tr><td>${d.id}</td><td>${fmt(stats.choice)}</td><td>${fmt(stats.spell)}</td><td>${fmt(stats.cloze)}</td><td>-</td><td style="color:#94a3b8;">${data.lastOnline || '未知'}</td><td style="color:var(--gold);">💰 ${data.coins||0}</td></tr>`;
                });
            } catch(e) { tbody.innerHTML = '<tr><td colspan="7">載入失敗</td></tr>'; }
        }

        async function syncQuestionsToCloud() {
            const statusEl = $('sync-status');
            const syncBtn = $('sync-data-btn');
            if(!newData || newData.length === 0) return alert("無數據可同步");
            statusEl.innerText = "⏳ 同步中...";
            syncBtn.disabled = true;
            try {
                const batch = fb.writeBatch(fb.db);
                newData.forEach(q => {
                    const safeId = q.en.replace(/\//g, '_'); 
                    const docRef = fb.doc(fb.db, "questions", safeId);
                    batch.set(docRef, q);
                });
                await batch.commit();
                statusEl.innerText = `✅ 成功同步 ${newData.length} 個題目！`;
                alert("同步成功！");
            } catch (e) {
                console.error("Firebase Error:", e);
                statusEl.innerText = "❌ 同步失敗: " + e.message;
                alert("同步失敗！");
            } finally { syncBtn.disabled = false; }
        }

        async function clearAllQuestions() {
            if (!confirm("⚠️ 確定要刪除雲端所有題目嗎？")) return;
            const statusEl = $('sync-status');
            const clearBtn = $('clear-questions-btn');
            statusEl.innerText = "⏳ 正在清空雲端數據...";
            clearBtn.disabled = true;
            try {
                const qSnap = await fb.getDocs(fb.collection(fb.db, "questions"));
                const batch = fb.writeBatch(fb.db);
                let count = 0;
                qSnap.forEach((doc) => { batch.delete(doc.ref); count++; });
                if(count > 0) await batch.commit();
                statusEl.innerText = `🗑️ 已清空雲端 ${count} 個題目！`;
                alert("清空完畢！");
                state.vocab = []; 
            } catch (e) {
                console.error(e);
                statusEl.innerText = "❌ 清空失敗";
            } finally { clearBtn.disabled = false; }
        }

        $('login-trigger').onclick = handleLogin;
        $('guest-trigger').onclick = () => { state.user = { id: "guest", coins: 500, collection: [], progress: {}, lastDaily: "", isGuest: true }; startCultivation(); };
        $('sync-data-btn').onclick = syncQuestionsToCloud;
        $('clear-questions-btn').onclick = clearAllQuestions;
        $('toggle-staff-btn').onclick = () => { const c = $('staff-content'); c.style.display = (c.style.display === 'flex' ? 'none' : 'flex'); };
        
        (async () => {
            try {
                const qSnap = await fb.getDocs(fb.collection(fb.db, "questions"));
                const cloudVocab = qSnap.docs.map(d => d.data());
                const combined = [...cloudVocab, ...newData];
                const seen = new Set();
                state.vocab = combined.filter(v => {
                    const duplicate = seen.has(v.en);
                    seen.add(v.en);
                    return !duplicate;
                });
            } catch(e) { state.vocab = newData; }
        })();

        window.startCultivation = startCultivation;
        window.endOpening = endOpening;
        window.goHome = () => showPage('home-page');
    </script>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(['home-page', 'shop-page', 'inv-page'].includes(id)) updateCoinDisplay();
        }

        function togglePassword(id, btn) {
            const el = document.getElementById(id); el.type = el.type === 'password' ? 'text' : 'password';
            btn.innerText = el.type === 'password' ? '👁️' : '👓';
        }

        function startCultivation() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('video-opening').style.display = 'flex';
            const vid = document.getElementById('opening-vid');
            vid.play().catch(endOpening);
            vid.onended = endOpening;
            document.getElementById('bg_music').play().catch(()=>{});
        }

        function endOpening() { 
            document.getElementById('video-opening').style.display = 'none'; 
            document.getElementById('opening-vid').pause(); 
            showPage('home-page'); 
        }

        function updateCoinDisplay() {
            if(window.state) {
                document.getElementById('home-coin').innerText = state.user.coins;
                if(document.getElementById('shop-coin')) document.getElementById('shop-coin').innerText = state.user.coins;
                syncCloud();
            }
        }

        async function syncCloud() {
            if(!state.user.id || state.user.id === 'guest') return;
            try { await fb.updateDoc(fb.doc(fb.db, "students", state.user.id), { coins: state.user.coins, collection: state.user.collection, progress: state.user.progress, lastDailyDate: state.user.lastDaily }); } catch(e) {}
        }

        window.onload = () => {
            $('open-choice').onclick = () => openLevelSelect('choice');
            $('open-spell').onclick = () => openLevelSelect('spell');
            $('open-cloze').onclick = () => openLevelSelect('cloze');
            $('daily-btn').onclick = startDaily;
            $('open-inv').onclick = showInv;
            $('settings-trigger').onclick = () => $('settings-modal').style.display='flex';
            $('settings-close').onclick = () => $('settings-modal').style.display='none';
            $('next-btn').onclick = () => nextQuestion();
            $('exit-game-btn').onclick = () => goBackOneLevel(); // 使用新邏輯
            $('skip-vid').onclick = endOpening;
            $('master-mute-btn').onclick = toggleMasterMute;
            $('bgm-vol').onchange = updateAudio;
            $('sfx-vol').onchange = updateAudio;
            $('inv-wea-btn').onclick = () => { state.ui.category='wea'; showInv(); };
            $('inv-pet-btn').onclick = () => { state.ui.category='pet'; showInv(); };
            $('shop-wea-btn').onclick = () => { state.ui.category='wea'; showShop(); };
            $('shop-pet-btn').onclick = () => { state.ui.category='pet'; showShop(); };
        };

        // 新增：退回一層的邏輯
        function goBackOneLevel() {
            if (state.game.mode === 'daily') {
                showPage('home-page');
            } else {
                showPage('level-page');
            }
        }

        function openLevelSelect(mode) {
            state.game.mode = mode;
            const container = document.getElementById('level-container'); container.innerHTML = '';
            const max = Math.ceil(state.vocab.length / 5);
            for(let i=1; i<=max; i++) {
                const div = document.createElement('div');
                const isCleared = state.user.progress[mode+'_'+i] !== undefined;
                div.className = `level-card ${mode} ${isCleared ? 'all-correct' : ''}`;
                div.innerText = i;
                div.onclick = () => {
                    state.game.level = i;
                    state.game.pool = state.vocab.slice((i-1)*5, i*5).map(v => ({...v, type: mode}));
                    startGame();
                };
                container.appendChild(div);
            }
            showPage('level-page');
        }

        function startGame() { state.game.idx = 0; state.game.correct = 0; showPage('game-page'); renderQuestion(); }

        function renderQuestion() {
            state.game.canAnswer = true; 
            const q = state.game.pool[state.game.idx];
            
            const area = document.getElementById('action-area'); 
            area.style.display = 'block'; 

            document.getElementById('game-progress-tag').innerText = `${state.game.idx + 1} / ${state.game.pool.length}`;
            document.getElementById('correct-answer-display').style.display = 'none'; 
            document.getElementById('next-btn').style.display = 'none';
            
            area.innerHTML = '';

            const posTag = q.p ? `<span style="font-size:0.9rem; color:#94a3b8; margin-left:8px;">${q.p}</span>` : '';

            if(q.type === 'spell') {
                setTimeout(() => speak(q.en), 1000);
                document.getElementById('q-main').innerHTML = `<button class="opt-btn" onclick="speak('${q.en}')">🔊 聽音朗讀</button>`;
                document.getElementById('q-hint').innerHTML = `解釋：${q.cn}<br><div style="margin-top: 10px; color: var(--gold); font-weight: normal; font-size: 1rem;">提示：${q.en.length} 個字母</div>`;
                
                const input = document.createElement('input'); 
                input.className = 'login-input'; input.placeholder = "輸入英文..."; input.autocomplete = "off";
                const btn = document.createElement('button'); 
                btn.className = 'btn-solid'; btn.innerText = "提交"; btn.style.width="100%"; btn.style.marginTop="10px";
                btn.onclick = () => checkAns(input.value.trim().toLowerCase() === q.en.toLowerCase(), q.en);
                input.onkeyup = (e) => { if(e.key === 'Enter') btn.click(); };
                area.append(input, btn);
                input.focus();
            } else {
                if(q.type === 'choice') {
                    document.getElementById('q-main').innerHTML = `${q.en}${posTag}`;
                } else {
                    document.getElementById('q-main').innerHTML = q.s.replace('______', '( ? )');
                }
                
                document.getElementById('q-hint').innerText = q.type === 'choice' ? "選擇解釋" : "選擇單字";
                const correctVal = q.type === 'choice' ? q.cn : q.en;
                makeOptions(correctVal, q.type === 'choice' ? 'cn' : 'en').forEach(opt => {
                    const b = document.createElement('button'); 
                    b.className = 'opt-btn'; 
                    b.innerText = opt; 
                    b.onclick = () => checkAns(opt === correctVal, correctVal);
                    area.appendChild(b);
                });
            }
        }

        function checkAns(isRight, correct) {
            if(!state.game.canAnswer) return; state.game.canAnswer = false;
            
            document.getElementById('action-area').style.display = 'none';

            const q = state.game.pool[state.game.idx];
            if(isRight) {
                state.game.correct++; state.user.coins += (state.game.mode === 'daily' ? 20 : 1);
                document.getElementById('win-sfx').play(); document.getElementById('slash-layer').classList.add('slash-active'); document.body.classList.add('shake-active');
                setTimeout(() => { document.getElementById('slash-layer').classList.remove('slash-active'); document.body.classList.remove('shake-active'); nextQuestion(); }, 800);
            } else {
                document.getElementById('lose-sfx').play(); 
                
                let displayCorrect = correct;
                if(q.type !== 'choice' && q.p) {
                    displayCorrect = `${correct} <span style="font-size:1rem; opacity:0.8;">${q.p}</span>`;
                }
                
                document.getElementById('correct-answer-display').innerHTML = `正確答案：${displayCorrect}`;
                document.getElementById('correct-answer-display').style.display = 'block'; 
                document.getElementById('next-btn').style.display = 'block';
            }
            updateCoinDisplay();
        }

        function nextQuestion() { state.game.idx++; if(state.game.idx < state.game.pool.length) renderQuestion(); else finishGame(); }

        function finishGame() {
            const win = state.game.correct >= (state.game.pool.length / 2);
            
            document.getElementById('result-img').src = win ? 'images/success01.png' : 'images/success02.png';
            const overlay = document.getElementById('result-overlay');
            overlay.style.display = 'flex'; overlay.style.pointerEvents = 'none'; 
            document.getElementById('success-sfx').play();
            
            state.user.progress[state.game.mode+'_'+(state.game.mode==='daily'?Date.now():state.game.level)] = `${state.game.correct}/${state.game.pool.length}`;
            if(state.game.mode === 'daily') state.user.lastDaily = new Date().toDateString();
            
            setTimeout(() => { 
                overlay.style.display = 'none'; 
                goBackOneLevel(); // 修改此處，改為退回一層
            }, 2000);
        }
        
        function showInv() {
            document.getElementById('inv-wea-btn').classList.toggle('active', state.ui.category === 'wea');
            document.getElementById('inv-pet-btn').classList.toggle('active', state.ui.category === 'pet');
            const grid = document.getElementById('inv-grid'); grid.innerHTML = '';
            state.user.collection.filter(n => n.startsWith(state.ui.category)).forEach(img => {
                const div = document.createElement('div'); div.className = 'inv-slot';
                div.innerHTML = `<img src="images/${img}" onerror="this.src='images/icon05.png'">`;
                div.onclick = () => { document.getElementById('weapon-display').src = `images/${img}`; document.getElementById('sword-modal').style.display = 'flex'; };
                grid.appendChild(div);
            });
            showPage('inv-page');
        }

        function showShop() {
            document.getElementById('shop-wea-btn').classList.toggle('active', state.ui.category === 'wea');
            document.getElementById('shop-pet-btn').classList.toggle('active', state.ui.category === 'pet');
            const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
            for(let i=1; i<=20; i++) {
                const imgName = `${state.ui.category}_${String(i).padStart(3,'0')}.png`;
                const owned = state.user.collection.includes(imgName);
                const div = document.createElement('div'); div.className = `shop-item ${owned ? 'owned' : 'locked'}`;
                div.innerHTML = `<img src="images/${imgName}" onerror="this.parentElement.style.display='none'"><div class="shop-price-tag">${owned ? '已持有' : '💰 '+(i*100)}</div>`;
                div.onclick = () => {
                    if(!owned && state.user.coins >= i*100) {
                        document.getElementById('confirm-msg').innerText = `是否花費 💰${i*100} 購買？`;
                        document.getElementById('custom-confirm-modal').style.display = 'flex';
                        document.getElementById('confirm-yes-btn').onclick = () => {
                            state.user.coins -= i*100; state.user.collection.push(imgName);
                            updateCoinDisplay(); showShop(); document.getElementById('custom-confirm-modal').style.display = 'none';
                            document.getElementById('success-sfx').play();
                        };
                    }
                };
                grid.appendChild(div);
            }
            showPage('shop-page');
        }

        function startDaily() {
            const now = new Date(); if(now.getDay() === 0 || now.getDay() === 6) return alert("週末不開放挑戰");
            if(state.user.lastDaily === now.toDateString()) return alert("今日已挑戰");
            state.game.mode = "daily";
            state.game.pool = [...state.vocab].sort(()=>0.5-Math.random()).slice(0, 10).map((v, i) => ({...v, type: ['choice','spell','cloze'][i%3]}));
            startGame();
        }

        function makeOptions(correct, key) {
            let opts = [correct];
            while(opts.length < 3) { 
                let rItem = state.vocab[Math.floor(Math.random()*state.vocab.length)];
                if(rItem && !opts.includes(rItem[key])) opts.push(rItem[key]); 
            }
            return opts.sort(() => 0.5 - Math.random());
        }

        function speak(txt) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; window.speechSynthesis.speak(u); }
        function updateAudio() {
            const bgmVal = document.getElementById('bgm-vol').value; const sfxVal = document.getElementById('sfx-vol').value;
            document.getElementById('bg_music').volume = bgmVal; state.ui.sfxVol = sfxVal;
            ['win-sfx','lose-sfx','success-sfx'].forEach(id => document.getElementById(id).volume = sfxVal);
        }
        function toggleMasterMute() {
            state.ui.isMuted = !state.ui.isMuted;
            const btn = document.getElementById('master-mute-btn');
            if(state.ui.isMuted) { 
                state.ui.lastBgmVol = $('bgm-vol').value; state.ui.lastSfxVol = $('sfx-vol').value; 
                $('bgm-vol').value = 0; $('sfx-vol').value = 0; btn.innerText = "🔇 全部靜音中";
            } else { 
                $('bgm-vol').value = state.ui.lastBgmVol; $('sfx-vol').value = state.ui.lastSfxVol; btn.innerText = "🔊 聲音：開啟中";
            }
            updateAudio();
        }
    </script>
</body>
