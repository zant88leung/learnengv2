<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語煉金術 V2.30 </title>
    <style>
        :root {
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.8); --accent: #6366f1;
            --gold: #f59e0b; --text: #f8fafc; --success: #22c55e; --error: #ef4444;
            --pink: #ec4899;
            --btn-wea: #431407; --btn-wea-active: #f59e0b;
            --btn-pet: #064e3b; --btn-pet-active: #10b981;
        }
        
        body { 
            margin: 0; font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg) url('images/main_bg.png') no-repeat center center fixed; 
            background-size: cover; color: var(--text); overflow-x: hidden;
        }

        .ui-max-width { width: 100%; max-width: 400px; }

        @keyframes slash-anim {
            0% { transform: translate(-100%, -50%) rotate(-20deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(100%, -50%) rotate(-20deg); opacity: 0; }
        }
        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .slash-effect {
            position: fixed; top: 50%; left: 0; width: 200%; height: 3px; 
            background: white; box-shadow: 0 0 15px #fff, 0 0 5px var(--accent);
            z-index: 10002; pointer-events: none; opacity: 0;
        }
        .slash-active { animation: slash-anim 0.3s ease-out forwards; }
        .shake-active { animation: shake-anim 0.15s ease-in-out 2; }

        .overlay-base { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        #result-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); cursor: pointer; display: none; }
        #result-img { max-width: 50%; max-height: 50%; object-fit: contain; animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        #start-overlay { background: var(--bg); z-index: 10001; flex-direction: column; }
        .start-logo { width: 80%; max-width: 400px; margin-bottom: 30px; filter: drop-shadow(0 0 20px var(--accent)); }
        
        .login-box { background: rgba(30, 41, 59, 0.9); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); display: flex; flex-direction: column; gap: 15px; width: 85%; max-width: 350px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        .input-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .login-input { padding: 15px; border-radius: 10px; border: 1px solid #475569; background: var(--bg); color: white; text-align: center; font-size: 1.1rem; outline: none; width: 100%; box-sizing: border-box; }
        .eye-btn { position: absolute; right: 12px; cursor: pointer; font-size: 1.2rem; user-select: none; opacity: 0.8; }
        
        .btn-base { border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-init { padding: 20px 50px; font-size: 1.5rem; color: white; background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #video-opening { position: fixed; inset: 0; background: black; z-index: 10000; display: none; }
        .skip-btn { position: absolute; bottom: 30px; right: 30px; background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid white; padding: 10px 20px; border-radius: 20px; cursor: pointer; }

        .page { display: none; padding: 20px; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .page.active { display: flex; }

        .header-ui { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .coin-bar { background: rgba(0, 0, 0, 0.6); padding: 8px 15px; border-radius: 30px; border: 1px solid var(--gold); color: var(--gold); font-weight: bold; }
        
        .hero-btn { width: 100%; height: 72px; font-size: 1.25rem; font-weight: 800; color: white; cursor: pointer; background: transparent no-repeat center / contain; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); margin-bottom: 12px; border: none; }
        .btn-1 { background-image: url('images/btn_icon_1.png'); }
        .btn-2 { background-image: url('images/btn_icon_2.png'); }
        .btn-3 { background-image: url('images/btn_icon_3.png'); }
        .btn-4 { background-image: url('images/btn_icon_4.png'); }
        .btn-5 { background-image: url('images/btn_icon_5.png'); }

        .category-nav { display: flex; gap: 10px; margin-bottom: 15px; }
        .cat-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; font-weight: bold; cursor: pointer; }
        .cat-btn-wea { background: var(--btn-wea); }
        .cat-btn-pet { background: var(--btn-pet); }
        .cat-btn.active { border-color: white; color: white; }
        .cat-btn-wea.active { background: var(--btn-wea-active); }
        .cat-btn-pet.active { background: var(--btn-pet-active); }

        .inventory, .shop-grid { display: grid; gap: 15px; width: 100%; max-width: 400px; }
        .inventory { grid-template-columns: repeat(3, 1fr); }
        .shop-grid { grid-template-columns: repeat(4, 1fr); }

        .inv-slot, .shop-item { background: var(--card); aspect-ratio: 1; border-radius: 15px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; overflow: hidden; }
        .inv-slot img, .shop-item img { width: 90%; height: 90%; object-fit: contain; transition: filter 0.3s, transform 0.3s; }
        
        .shop-item.locked img { filter: brightness(0); opacity: 0.7; }
        .shop-item.owned img { filter: none; opacity: 0.4; }
        .shop-price-tag { position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.7); font-size: 0.7rem; color: var(--gold); text-align: center; padding: 2px 0; z-index: 2; }

        .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
        .level-card { 
            background: var(--card); aspect-ratio: 1; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.3rem; border: 3px solid; cursor: pointer; position: relative; 
            color: white !important; font-weight: bold;
        }
        .level-card.choice { border-color: var(--accent); } 
        .level-card.spell { border-color: var(--gold); }     
        .level-card.cloze { border-color: var(--pink); }     
        
        .level-card.all-correct::after { content: '✔️'; position: absolute; top: -5px; right: -5px; background: var(--success); border-radius: 50%; font-size: 0.8rem; padding: 2px; color: white; border: 1px solid white; }

        .q-card { background: var(--card); padding: 30px; border-radius: 24px; text-align: center; margin: 20px 0; border: 2px solid transparent; backdrop-filter: blur(10px); }
        .btn-solid { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); border-radius: 15px; padding: 12px 20px; color: white; border: none; font-weight: bold; cursor: pointer; }
        .opt-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 18px; border-radius: 15px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 1.1rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        
        /* 靜音按鈕專用樣式 */
        .mute-toggle-btn { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 2px solid var(--accent); background: rgba(99, 102, 241, 0.2); color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; }
        .mute-toggle-btn.is-muted { border-color: var(--error); background: rgba(239, 68, 68, 0.2); color: var(--error); }
    </style>
</head>
<body>

    <div id="slash-layer" class="slash-effect"></div>

    <div id="result-overlay" class="overlay-base" onclick="closeResultImmediately()">
        <img id="result-img" src="">
    </div>

    <div id="start-overlay" class="overlay-base">
        <img src="images/title_logo.png" class="start-logo">
        <div class="login-box">
            <h3 style="text-align:center; margin:0; color:var(--gold);">修行者報到</h3>
            <input type="text" id="stu-id" class="login-input" placeholder="學生編號ID">
            <div class="input-wrapper">
                <input type="password" id="stu-pwd" class="login-input" placeholder="密碼Password">
                <span class="eye-btn" onclick="togglePassword('stu-pwd', this)">👁️</span>
            </div>
            <button class="btn-base btn-init" style="font-size: 1.2rem; padding: 15px;" onclick="handleLogin()">進入修行</button>
            <button class="btn-solid" style="background: #475569;" onclick="handleGuestLogin()">以訪客身份體驗</button>
        </div>
    </div>

    <div id="admin-page" class="page">
        <div class="ui-max-width">
            <div class="header-ui">
                <h2 style="color:var(--gold)">📜 管理後台</h2>
                <button class="btn-solid" onclick="location.reload()">登出</button>
            </div>
            <div id="admin-display-area" style="background:var(--card); border-radius:15px; height:300px; overflow-y:auto; margin-bottom:20px;"></div>
            
            <div style="background:var(--card); padding:20px; border-radius:15px; border: 1px solid var(--success);">
                <h3 style="color:var(--success); margin-top:0;">錄入新學生</h3>
                <input type="text" id="add-id" class="login-input" placeholder="學號" style="margin-bottom:10px;">
                <input type="password" id="add-pwd" class="login-input" placeholder="密碼" style="margin-bottom:10px;">
                <button class="btn-solid" style="width:100%; background:var(--success);" onclick="adminAddStudent()">確認錄入</button>
            </div>
        </div>
    </div>

    <div id="video-opening" class="overlay-base">
        <video id="opening-vid" style="width:100%; height:100%; object-fit:contain;" playsinline>
            <source src="video/opening.mp4" type="video/mp4">
        </video>
        <button class="skip-btn" onclick="endOpening()">跳過 Skip</button>
    </div>

    <div id="home-page" class="page">
        <img src="images/title_logo2.png" style="width:100%; max-width:224px; margin:10px 0;">
        <div class="header-ui ui-max-width">
            <div onclick="toggleSettings(true)" style="cursor:pointer; font-size:1.5rem;">⚙️</div>
            <div class="coin-bar">💰 <span id="home-coin">0</span></div>
        </div>
        <div class="ui-max-width">
            <button class="hero-btn btn-1" onclick="openLevelSelect('choice')">真意之殿</button>
            <button class="hero-btn btn-2" onclick="openLevelSelect('spell')">迴音之谷</button>
            <button class="hero-btn btn-3" onclick="openLevelSelect('cloze')">萬辭之塔</button>
            <button id="daily-btn" class="hero-btn btn-4" onclick="startDaily()">每日挑戰</button>
            <button class="hero-btn btn-5" onclick="showInv()">藏寶閣</button>
        </div>
    </div>

    <div id="game-page" class="page">
        <div id="game-progress-tag" class="coin-bar" style="margin-top:10px;">0 / 0</div>
        <div class="ui-max-width">
            <div class="q-card" id="q-card-box">
                <div id="q-main" style="font-weight: bold; font-size: 1.5rem; margin-bottom: 10px;"></div>
                <div id="q-hint" style="color: var(--gold); font-weight: bold;"></div>
                <div id="correct-answer-display" style="color: #fb7185; margin-top: 15px; display: none; font-size: 1.4rem; font-weight: bold;"></div>
            </div>
            <div id="action-area"></div>
            <button id="next-btn" class="btn-solid" style="display: none; width:100%; margin-top:10px;" onclick="nextQuestion()">下一題</button>
            <button onclick="goHome()" style="background:none; border:none; color:#cbd5e1; width:100%; margin-top:20px;">結束修行</button>
        </div>
    </div>

    <div id="inv-page" class="page">
        <div class="header-ui ui-max-width">
            <button class="btn-solid" onclick="goHome()">返回</button>
            <button class="btn-solid" style="background:var(--pink)" onclick="showShop()">商店 🛒</button>
        </div>
        <div class="category-nav ui-max-width">
            <button id="inv-wea-btn" class="cat-btn cat-btn-wea" onclick="setCategory('inv','wea')">⚔️ 神兵</button>
            <button id="inv-pet-btn" class="cat-btn cat-btn-pet" onclick="setCategory('inv','pet')">🐾 靈寵</button>
        </div>
        <div class="inventory ui-max-width" id="inv-grid"></div>
    </div>

    <div id="shop-page" class="page">
        <div class="header-ui ui-max-width">
            <div class="coin-bar">💰 <span id="shop-coin">0</span></div>
            <button class="btn-solid" onclick="showInv()">返回</button>
        </div>
        <div class="category-nav ui-max-width">
            <button id="shop-wea-btn" class="cat-btn cat-btn-wea" onclick="setCategory('shop','wea')">⚔️ 神兵</button>
            <button id="shop-pet-btn" class="cat-btn cat-btn-pet" onclick="setCategory('shop','pet')">🐾 靈寵</button>
        </div>
        <div class="shop-grid ui-max-width" id="shop-grid"></div>
    </div>

    <div id="level-page" class="page">
        <h2 id="level-title" style="color:var(--gold);">修行關卡</h2>
        <div class="level-grid ui-max-width" id="level-container"></div>
        <button class="btn-solid" onclick="goHome()" style="margin-top:40px;">返回主頁</button>
    </div>

    <div id="settings-modal" class="modal">
        <div style="background:var(--card); padding:30px; border-radius:20px; width:80%; max-width:300px;">
            <h3 style="text-align:center; color:var(--gold);">系統設定</h3>
            
            <button id="master-mute-btn" class="mute-toggle-btn" onclick="toggleMasterMute()">🔊 聲音：開啟中</button>
            
            <p>背景音樂：<input type="range" id="bgm-vol" min="0" max="1" step="0.1" value="0.5" onchange="updateAudio()"></p>
            <p>音效大小：<input type="range" id="sfx-vol" min="0" max="1" step="0.1" value="0.8" onchange="updateAudio()"></p>
            
            <button class="btn-solid" style="width:100%; margin-top:10px;" onclick="toggleSettings(false)">確定</button>
        </div>
    </div>

    <div id="sword-modal" class="modal" onclick="this.style.display='none'">
        <img id="weapon-display" style="max-width:80%;" src="">
    </div>

    <audio id="bg_music" src="audio/bg_music.mp3" loop></audio>
    <audio id="win-sfx" src="audio/win.mp3"></audio>
    <audio id="lose-sfx" src="audio/lose.mp3"></audio>
    <audio id="success-sfx" src="audio/success.mp3"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBl9Z3Y1X2W3V4U5T6S7R8Q9P0O", 
            authDomain: "learn-english-ab8f8.firebaseapp.com", 
            projectId: "learn-english-ab8f8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.fb = { db, doc, getDoc, setDoc, updateDoc, collection, getDocs, writeBatch };
        initGameData();
    </script>

    <script>
        const state = {
            user: { id: "", coins: 0, collection: [], progress: {}, lastDaily: "", isGuest: false },
            vocab: [],
            game: { mode: "", level: 0, idx: 0, correct: 0, pool: [], canAnswer: true },
            ui: { category: "wea", sfxVol: 0.8, isMuted: false, lastBgmVol: 0.5, lastSfxVol: 0.8 }
        };

        const $ = id => document.getElementById(id);

        async function initGameData() {
            try {
                const snap = await fb.getDocs(fb.collection(fb.db, "questions"));
                state.vocab = snap.docs.map(d => d.data());
            } catch(e) { console.error("加載題目失敗"); }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            $(id).classList.add('active');
            if(['home-page', 'shop-page', 'inv-page'].includes(id)) updateCoinDisplay();
        }

        function togglePassword(id, btn) {
            const el = $(id);
            el.type = el.type === 'password' ? 'text' : 'password';
            btn.innerText = el.type === 'password' ? '👁️' : '👓';
        }

        async function handleLogin() {
            const id = $('stu-id').value.trim();
            const pwd = $('stu-pwd').value.trim();
            if(!id || !pwd) return alert("請輸入資訊");

            try {
                const docSnap = await fb.getDoc(fb.doc(fb.db, "students", id));
                if(docSnap.exists() && docSnap.data().password === pwd) {
                    const data = docSnap.data();
                    if(data.role === "super admin") {
                        showPage('admin-page');
                        loadAdminStats();
                        return;
                    }
                    state.user = { id, coins: data.coins||0, collection: data.collection||[], progress: data.progress||{}, lastDaily: data.lastDailyDate||"", isGuest: false };
                    startCultivation();
                } else { alert("驗證失敗"); }
            } catch(e) { alert("連線錯誤"); }
        }

        function handleGuestLogin() {
            state.user = { id: "guest", coins: 500, collection: [], progress: {}, lastDaily: "", isGuest: true };
            startCultivation();
        }

        function startCultivation() {
            $('start-overlay').style.display = 'none';
            $('video-opening').style.display = 'flex';
            const vid = $('opening-vid');
            vid.play().catch(endOpening);
            vid.onended = endOpening;
            $('bg_music').play().catch(()=>{});
        }

        function endOpening() {
            $('video-opening').style.display = 'none';
            $('opening-vid').pause();
            showPage('home-page');
        }

        function setCategory(page, cat) {
            state.ui.category = cat;
            page === 'inv' ? showInv() : showShop();
        }

        function showInv() {
            $('inv-wea-btn').classList.toggle('active', state.ui.category === 'wea');
            $('inv-pet-btn').classList.toggle('active', state.ui.category === 'pet');
            const grid = $('inv-grid');
            grid.innerHTML = '';
            state.user.collection.filter(n => n.startsWith(state.ui.category)).forEach(img => {
                const div = document.createElement('div');
                div.className = 'inv-slot';
                div.innerHTML = `<img src="images/${img}" onerror="this.src='images/icon05.png'">`;
                div.onclick = () => { $('weapon-display').src = `images/${img}`; $('sword-modal').style.display = 'flex'; };
                grid.appendChild(div);
            });
            showPage('inv-page');
        }

        function showShop() {
            $('shop-wea-btn').classList.toggle('active', state.ui.category === 'wea');
            $('shop-pet-btn').classList.toggle('active', state.ui.category === 'pet');
            const grid = $('shop-grid');
            grid.innerHTML = '';
            for(let i=1; i<=20; i++) {
                const imgName = `${state.ui.category}_${String(i).padStart(3,'0')}.png`;
                const owned = state.user.collection.includes(imgName);
                const div = document.createElement('div');
                div.className = `shop-item ${owned ? 'owned' : 'locked'}`;
                div.innerHTML = `<img src="images/${imgName}" onerror="this.parentElement.style.display='none'"><div class="shop-price-tag">${owned ? '已持有' : '💰 '+(i*100)}</div>`;
                div.onclick = () => {
                    if(!owned && state.user.coins >= i*100) {
                        if(confirm(`是否花費 💰${i*100} 購買此神秘寶物？`)) {
                            state.user.coins -= i*100;
                            state.user.collection.push(imgName);
                            updateCoinDisplay();
                            showShop();
                        }
                    }
                };
                grid.appendChild(div);
            }
            showPage('shop-page');
        }

        function openLevelSelect(mode) {
            state.game.mode = mode;
            const container = $('level-container');
            container.innerHTML = '';
            const max = Math.ceil(state.vocab.length / 5);
            for(let i=1; i<=max; i++) {
                const div = document.createElement('div');
                div.className = `level-card ${mode} ${state.user.progress[mode+'_'+i] ? 'all-correct' : ''}`;
                div.innerText = i;
                div.onclick = () => {
                    state.game.level = i;
                    state.game.pool = state.vocab.slice((i-1)*5, i*5).map(v => ({...v, type: mode}));
                    startGame();
                };
                container.appendChild(div);
            }
            showPage('level-page');
        }

        function startDaily() {
            if(state.user.lastDaily === new Date().toDateString()) return alert("今日已挑戰");
            state.game.pool = [...state.vocab].sort(()=>0.5-Math.random()).slice(0, 10).map((v, i) => ({...v, type: ['choice','spell','cloze'][i%3]}));
            state.game.mode = "daily";
            startGame();
        }

        function startGame() {
            state.game.idx = 0;
            state.game.correct = 0;
            showPage('game-page');
            renderQuestion();
        }

        function renderQuestion() {
            state.game.canAnswer = true;
            const q = state.game.pool[state.game.idx];
            $('game-progress-tag').innerText = `${state.game.idx + 1} / ${state.game.pool.length}`;
            $('q-card-box').className = 'q-card';
            $('correct-answer-display').style.display = 'none';
            $('next-btn').style.display = 'none';
            
            const area = $('action-area');
            area.innerHTML = '';

            if(q.type === 'spell') {
                $('q-main').innerHTML = `<button class="opt-btn" onclick="speak('${q.en}')">🔊 聽音朗讀</button>`;
                $('q-hint').innerText = `拼出單字 (解釋：${q.cn})`;
                const input = document.createElement('input');
                input.className = 'login-input';
                input.placeholder = "輸入英文...";
                const btn = document.createElement('button');
                btn.className = 'btn-solid'; btn.innerText = "提交回答"; btn.style.width="100%"; btn.style.marginTop="10px";
                btn.onclick = () => checkAns(input.value.trim().toLowerCase() === q.en.toLowerCase(), q.en);
                area.append(input, btn);
                setTimeout(()=>speak(q.en), 500);
            } else {
                $('q-main').innerText = q.type === 'choice' ? q.en : q.s.replace('______', '( ? )');
                $('q-hint').innerText = q.type === 'choice' ? "選擇正確解釋" : "選擇合適單字";
                const correctVal = q.type === 'choice' ? q.cn : q.en;
                makeOptions(correctVal, q.type === 'choice' ? 'cn' : 'en').forEach(opt => {
                    const b = document.createElement('button');
                    b.className = 'opt-btn';
                    b.innerText = opt;
                    b.onclick = () => checkAns(opt === correctVal, correctVal);
                    area.appendChild(b);
                });
            }
        }

        function checkAns(isRight, correct) {
            if(!state.game.canAnswer) return;
            state.game.canAnswer = false;

            if(isRight) {
                state.game.correct++;
                state.user.coins += (state.game.mode === 'daily' ? 20 : 1);
                $('win-sfx').play();
                $('slash-layer').classList.add('slash-active');
                document.body.classList.add('shake-active');
                setTimeout(() => {
                    $('slash-layer').classList.remove('slash-active');
                    document.body.classList.remove('shake-active');
                    nextQuestion();
                }, 800);
            } else {
                $('lose-sfx').play();
                $('correct-answer-display').innerText = `正確答案：${correct}`;
                $('correct-answer-display').style.display = 'block';
                $('next-btn').style.display = 'block';
            }
            updateCoinDisplay();
        }

        function nextQuestion() {
            state.game.idx++;
            if(state.game.idx < state.game.pool.length) renderQuestion();
            else finishGame();
        }

        function finishGame() {
            const win = state.game.correct / state.game.pool.length >= 0.5;
            $('result-img').src = win ? 'images/success01.png' : 'images/success02.png';
            $('result-overlay').style.display = 'flex';
            $('success-sfx').play();

            if(state.game.mode === 'daily') state.user.lastDaily = new Date().toDateString();
            else if(state.game.correct === state.game.pool.length) state.user.progress[state.game.mode+'_'+state.game.level] = true;
            
            setTimeout(closeResultImmediately, 3000);
        }

        function closeResultImmediately() {
            $('result-overlay').style.display = 'none';
            state.game.mode === 'daily' ? goHome() : openLevelSelect(state.game.mode);
        }

        function updateCoinDisplay() {
            $('home-coin').innerText = state.user.coins;
            if($('shop-coin')) $('shop-coin').innerText = state.user.coins;
            checkDailyBtn();
            syncCloud();
        }

        function checkDailyBtn() {
            const done = state.user.lastDaily === new Date().toDateString();
            $('daily-btn').disabled = done;
            $('daily-btn').innerText = done ? "明日再戰" : "每日挑戰";
        }

        async function syncCloud() {
            if(state.user.isGuest || !state.user.id) return;
            await fb.updateDoc(fb.doc(fb.db, "students", state.user.id), {
                coins: state.user.coins,
                collection: state.user.collection,
                progress: state.user.progress,
                lastDailyDate: state.user.lastDaily
            });
        }

        function goHome() { showPage('home-page'); }
        function toggleSettings(show) { $('settings-modal').style.display = show ? 'flex' : 'none'; }

        // 修改後的音量更新邏輯
        function updateAudio() {
            const bgmVal = $('bgm-vol').value;
            const sfxVal = $('sfx-vol').value;
            
            $('bg_music').volume = bgmVal;
            state.ui.sfxVol = sfxVal;
            ['win-sfx','lose-sfx','success-sfx'].forEach(id => $(id).volume = sfxVal);
            
            // 如果手動調低到 0，更新靜音按鈕狀態
            if(bgmVal == 0 && sfxVal == 0) {
                state.ui.isMuted = true;
                refreshMuteBtnUI();
            } else {
                state.ui.isMuted = false;
                refreshMuteBtnUI();
            }
        }

        // 一鍵靜音功能
        function toggleMasterMute() {
            const btn = $('master-mute-btn');
            state.ui.isMuted = !state.ui.isMuted;
            
            if(state.ui.isMuted) {
                // 記錄靜音前的音量
                state.ui.lastBgmVol = $('bgm-vol').value;
                state.ui.lastSfxVol = $('sfx-vol').value;
                
                // 歸零
                $('bgm-vol').value = 0;
                $('sfx-vol').value = 0;
            } else {
                // 恢復音量 (若紀錄為0則給預設值)
                $('bgm-vol').value = state.ui.lastBgmVol > 0 ? state.ui.lastBgmVol : 0.5;
                $('sfx-vol').value = state.ui.lastSfxVol > 0 ? state.ui.lastSfxVol : 0.8;
            }
            
            updateAudio();
            refreshMuteBtnUI();
        }

        function refreshMuteBtnUI() {
            const btn = $('master-mute-btn');
            if(state.ui.isMuted) {
                btn.innerText = "🔇 全部靜音中";
                btn.classList.add('is-muted');
            } else {
                btn.innerText = "🔊 聲音：開啟中";
                btn.classList.remove('is-muted');
            }
        }

        function makeOptions(correct, key) {
            let opts = [correct];
            while(opts.length < 3) {
                let r = state.vocab[Math.floor(Math.random()*state.vocab.length)][key];
                if(!opts.includes(r)) opts.push(r);
            }
            return opts.sort(() => 0.5 - Math.random());
        }

        function speak(txt) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(txt);
            utterance.lang = 'en-US';
            utterance.volume = state.ui.sfxVol;
            window.speechSynthesis.speak(utterance);
        }

        async function loadAdminStats() {
            const area = $('admin-display-area');
            area.innerHTML = "<p style='text-align:center;'>載入中...</p>";
            const snap = await fb.getDocs(fb.collection(fb.db, "students"));
            let html = `<table style="width:100%; border-collapse:collapse; font-size:0.8rem;">
                <tr style="color:var(--gold); border-bottom:1px solid #475569;">
                    <th>ID</th><th>💰</th><th>進度</th>
                </tr>`;
            snap.forEach(d => {
                const u = d.data();
                if(u.role !== 'super admin') {
                    html += `<tr style="text-align:center; border-bottom:1px solid #1e293b;">
                        <td>${d.id}</td><td>${u.coins}</td><td>${Object.keys(u.progress||{}).length} 關</td>
                    </tr>`;
                }
            });
            area.innerHTML = html + "</table>";
        }
    </script>
</body>
</html>
